<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Terisolir</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; padding: 50px; }
        .card { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #e74c3c; }
        p { color: #555; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Layanan Internet Terisolir</h2>
        <p>Masa aktif paket internet Anda telah habis atau pembayaran belum diterima.</p>
        <p>Silakan lakukan pembayaran atau hubungi admin untuk mengaktifkan kembali layanan Anda.</p>
        <a href="#" class="btn">Hubungi Admin / WhatsApp</a>
    </div>
</body>
</html>
